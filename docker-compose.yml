services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrip}
      POSTGRES_USER: ${POSTGRES_USER:-hrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrip}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: ${HRIP_ENV_FILE:-.env}
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8001"
    volumes:
      - .:/app

  preprocessing:
    build:
      context: .
      dockerfile: services/preprocessing/Dockerfile
    env_file: ${HRIP_ENV_FILE:-.env}
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  detection:
    build:
      context: .
      dockerfile: services/detection/Dockerfile
    env_file: ${HRIP_ENV_FILE:-.env}
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  risk:
    build:
      context: .
      dockerfile: services/risk/Dockerfile
    env_file: ${HRIP_ENV_FILE:-.env}
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: ${HRIP_ENV_FILE:-.env}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
    env_file: ${HRIP_ENV_FILE:-.env}
    environment:
      - DATABASE_URL=postgresql://hrip:hrip@postgres:5432/hrip?schema=public
    depends_on:
      - api
      - gateway
    ports:
      - "3000:3000"

volumes:
  postgres_data:
