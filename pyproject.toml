[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrip"
version = "0.1.0"
description = "Human Risk Intelligence Platform monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "beautifulsoup4>=4.12.3",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "passlib>=1.7.4",
  "pydantic-settings>=2.5.2",
  "pydantic[email]>=2.9.2",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.12",
  "redis[hiredis]>=5.0.8",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.31.0",
  "lightgbm>=4.5.0",
  "scikit-learn>=1.5.2",
  "pandas>=2.2.3",
  "shap>=0.46.0",
  "joblib>=1.4.2",
  "requests>=2.32.3",
  "google-genai>=0.2.0",
  "openai>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9"
]

[tool.setuptools]
packages = [
  "hrip_shared",
  "hrip_shared.ai",
  "hrip_shared.auth",
  "hrip_shared.broker",
  "hrip_shared.contracts",
  "hrip_shared.db",
  "hrip_shared.services",
  "hrip_shared.utils"
]

[tool.setuptools.package-dir]
hrip_shared = "shared/hrip_shared"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services"]

[tool.ruff]
line-length = 100
target-version = "py311"
